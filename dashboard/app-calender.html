<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>FoodLink</title>
	<!-- Favicon icon -->
	<link rel="icon" type="image/png" sizes="16x16" href="./images/favicon.png">

	<link href="./vendor/fullcalendar/css/fullcalendar.min.css" rel="stylesheet">
	<link href="./vendor/bootstrap-select/dist/css/bootstrap-select.min.css" rel="stylesheet">
	<link href="./css/style.css" rel="stylesheet">
	<link href="./css/icomoon.css" rel="stylesheet">

</head>

<body>
	<div class="row page-titles mx-0">
		<div class="col-sm-6 p-md-0">
			<div class="welcome-text">
				<h4>Lịch đặt bàn</h4>
			</div>
		</div>
	</div>
	<!-- row -->


	<div class="row">
		<div class="col-xl-3">
			<div class="card">
				<div class="card-body">
					<h4 class="card-intro-title">Lịch</h4>

					<div class="">
						<div id="external-events" class="my-3">
							<p>Kéo thả hoặc bấm vào sự kiện trong lịch</p>
							<div class="external-event" data-class="bg-primary"><i class="fa fa-move"></i>Bàn 2 người</div>
							<div class="external-event" data-class="bg-success"><i class="fa fa-move"></i>Bàn 4-8 người</div>
							<div class="external-event" data-class="bg-warning"><i class="fa fa-move"></i>Sinh nhật</div>
							<div class="external-event" data-class="bg-dark"><i class="fa fa-move"></i>Đám cưới</div>
						</div>
						<!-- checkbox -->
						<div class="checkbox custom-control checkbox-event custom-checkbox pt-3 pb-5">
							<input type="checkbox" class="custom-control-input" id="drop-remove">
							<label class="custom-control-label" for="drop-remove">Xóa khi thả</label>
						</div>
						<a href="javascript:void()" data-toggle="modal" data-target="#add-category"
							class="btn btn-primary btn-event w-100">
							<span class="align-middle"><i class="ti-plus"></i></span> Tạo mới
						</a>
					</div>
				</div>
			</div>
		</div>
		<div class="col-xl-9">
			<div class="card">
				<div class="card-body">
					<div id="calendar" class="app-fullcalendar"></div>
				</div>
			</div>
		</div>
		<!-- BEGIN MODAL -->
		<div class="modal fade none-border" id="event-modal">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title"><strong>Thêm sự kiện</strong></h4>
					</div>
					<div class="modal-body"></div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default waves-effect" data-dismiss="modal">Close</button>
						<button type="button" class="btn btn-success save-event waves-effect waves-light">Create
							event</button>

						<button type="button" class="btn btn-danger delete-event waves-effect waves-light"
							data-dismiss="modal">Xóa</button>
					</div>
				</div>
			</div>
		</div>
		<!-- Modal Add Category -->
		<div class="modal fade none-border" id="add-category">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title"><strong>Thêm danh mục</strong></h4>
					</div>
					<div class="modal-body">
						<form>
							<div class="row">
								<div class="col-md-6">
									<label class="control-label">Tên danh mục</label>
									<input class="form-control form-white" placeholder="Nhập tên" type="text"
										name="category-name">
								</div>
								<div class="col-md-6">
									<label class="control-label">Chọn màu</label>
									<select class="form-control form-white" data-placeholder="Chọn một màu..."
										name="category-color">
										<option value="success">Success</option>
										<option value="danger">Danger</option>
										<option value="info">Info</option>
										<option value="pink">Pink</option>
										<option value="primary">Primary</option>
										<option value="warning">Warning</option>
									</select>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default waves-effect" data-dismiss="modal">Close</button>
						<button type="button" class="btn btn-danger waves-effect waves-light save-category"
							data-dismiss="modal">Save</button>
					</div>
				</div>
			</div>
		</div>
	</div>



	<!--**********************************
            Content body end
        ***********************************-->
	<!--**********************************
        Scripts
    ***********************************-->
	<!-- Required vendors -->
	<script src="./vendor/global/global.min.js"></script>
	<script src="./vendor/bootstrap-select/dist/js/bootstrap-select.min.js"></script>
	<script src="./vendor/chart.js/Chart.bundle.min.js"></script>
	<script src="./js/custom.min.js"></script>
	<script src="./js/deznav-init.js"></script>
	<!-- Apex Chart -->
	<script src="./vendor/apexchart/apexchart.js"></script>
	<!--removeIf(production)-->




	<script src="./vendor/jqueryui/js/jquery-ui.min.js"></script>
	<script src="./vendor/moment/moment.min.js"></script>

	<script src="./vendor/fullcalendar/js/fullcalendar.min.js"></script>
	<script src="./js/plugins-init/fullcalendar-init.js"></script>
</body>

</html>

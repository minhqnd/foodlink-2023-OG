<!DOCTYPE html>
<html lang="en" class="h-100">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FoodLink</title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon.png">
    <link href="./css/style.css" rel="stylesheet">

</head>

<body class="h-100">
    <div class="authincation h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100 align-items-center">
                <div class="col-md-6">
                    <div class="authincation-content">
                        <div class="row no-gutters">
                            <div class="col-xl-12">
                                <div class="auth-form">
                                    <h4 class="text-center mb-4">Đăng ký tài khoản</h4>
                                    <H3 style="text-align: center;">ĐỂ LẤY TÀI KHOẢN VUI LÒNG LIÊN HỆ BỘ PHẬN IT</H3>
                                    <br>
                                    <p>Nếu muốn test thử tính năng tạo tài khoản thì bấm vào <u><a href="#" onclick="javascript:document.querySelector('form').style.display = 'block';">đây</a></u></p>
                                    <form action="javascript:signup(this);" style="display:none;">
                                        <div class="form-group">
                                            <label class="mb-1"><strong>Email</strong></label>
                                            <input id="email" type="email" class="form-control" placeholder="hello@example.com" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="mb-1"><strong>Mật khẩu</strong></label>
                                            <input id="password" type="password" class="form-control" placeholder="Password" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="mb-1"><strong>Nhập lại mật khẩu</strong></label>
                                            <input id="repassword" type="password" class="form-control" placeholder="Password" required>
                                        </div>
                                        <div class="password-help"></div>
                                        <div class="text-center mt-4">
                                            <button type="submit" class="btn btn-primary btn-block"">Đăng ký</button>
                                        </div>
                                    </form>
                                    <div class="new-account mt-3">
                                        <p>Đã có tài khoản? <a class="text-primary" href="login.html">Đăng nhập</a></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
<script src="../static/script/data.js"></script>
<script src="./script/auth.js"></script>
</html>
